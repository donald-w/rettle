name: CI and Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment (qa for auto, prod for promotion)"
        type: choice
        required: true
        default: qa
        options:
          - qa
          - prod

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'qa' }}
    outputs:
      deploy_env: ${{ steps.deploy_env.outputs.deploy_env }}
      deploy_url: ${{ steps.deploy_env.outputs.deploy_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Select build target
        run: |
          if [[ "${DEPLOY_ENV}" == "prod" ]]; then
            echo "BUILD_SCRIPT=build:prod" >> "$GITHUB_ENV"
          else
            echo "BUILD_SCRIPT=build:qa" >> "$GITHUB_ENV"
          fi

      - name: Build for Pages
        run: npm run "${BUILD_SCRIPT}"
        env:
          BUILD_SCRIPT: ${{ env.BUILD_SCRIPT }}

      - name: Set deploy env output
        id: deploy_env
        run: |
          if [[ "${DEPLOY_ENV}" == "prod" ]]; then
            URL="http://mypojo.io/rettle/"
          else
            URL="http://mypojo.io/rettle-qa/"
          fi
          echo "deploy_env=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
          echo "deploy_url=${URL}" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_ENV: ${{ env.DEPLOY_ENV }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/rettle/browser

  deploy:
    name: Deploy to ${{ needs.build.outputs.deploy_env }}
    needs: build
    environment:
      name: ${{ needs.build.outputs.deploy_env }}
      url: ${{ needs.build.outputs.deploy_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
