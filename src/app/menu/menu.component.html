<div class="menu-page">
  <h1>Menu</h1>
  <p>Game settings and extras will live here soon.</p>

  <div class="setting">
    <label class="toggle">
      <input
        type="checkbox"
        [checked]="(settingsService.colourAccessibilityMode$ | async) ?? false"
        (change)="onColourAccessibilityModeChanged(($any($event.target)).checked)"
      />
      <span>
        <strong>Colour accessibility mode</strong>
        <span class="hint">Uses an alternate palette that’s easier to tell apart.</span>
      </span>
    </label>
  </div>
  <button routerLink="/game" type="button">Back to game</button>
</div>
